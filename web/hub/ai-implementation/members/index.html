<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<meta name="robots" content="noindex,nofollow">
<title>Members — Small Business Tools</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,600;12..96,700&family=Hanken+Grotesk:wght@400;500;600&display=swap" rel="stylesheet">
<!-- Members area (2026-11-20): Continue with Google → worker action "member" checks the Google sign-in and the members list →
     the member's apps (Client Studio links, opened at /studio/ on this domain). Token kept in this browser for 30 days. -->
<style>
:root { --bg: #ffffff; --surface: #f2f7f2; --ink: #1a2a1a; --ink-head: #0f1f2e; --ink-soft: #5f715f; --line: #d4e4d4; --accent: #1b881b; }
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) { --bg: #101611; --surface: #18211a; --ink: #e3ece3; --ink-head: #f2f7f2; --ink-soft: #9db09d; --line: #2b3a2d; --accent: #5fc45f; }
}
* { box-sizing: border-box; }
html, body { margin: 0; background: var(--bg); color: var(--ink); font: 17px/1.55 "Hanken Grotesk", system-ui, sans-serif; }
.wrap { max-width: 560px; margin: 0 auto; padding: 48px 16px 80px; }
a.home { color: var(--ink-soft); text-decoration: none; font-size: 14px; }
h1 { font: 700 34px/1.15 "Bricolage Grotesque", system-ui, sans-serif; color: var(--ink-head); margin: 18px 0 8px; }
p.lede { color: var(--ink-soft); margin: 0 0 28px; }
.card { background: var(--surface); border: 1px solid var(--line); border-radius: 16px; padding: 22px; margin: 0 0 14px; }
.app { display: block; text-decoration: none; color: inherit; transition: border-color .15s; }
.app:hover, .app:focus-visible { border-color: var(--accent); outline: none; }
.app .t { font: 600 19px/1.3 "Bricolage Grotesque", system-ui, sans-serif; color: var(--ink-head); }
.app .m { font-size: 14px; color: var(--ink-soft); margin-top: 4px; }
.app .go { color: var(--accent); font-weight: 600; font-size: 15px; margin-top: 12px; }
.who { display: flex; align-items: center; gap: 10px; font-size: 14px; color: var(--ink-soft); margin: 0 0 22px; }
.who img { width: 28px; height: 28px; border-radius: 50%; }
.who button { margin-left: auto; font: 500 14px "Hanken Grotesk", sans-serif; background: none; border: 1px solid var(--line); color: var(--ink-soft); border-radius: 999px; padding: 6px 14px; cursor: pointer; }
.msg { padding: 14px 16px; border-radius: 12px; background: #fbe4dc; color: #7c2d12; font-size: 15px; margin: 0 0 16px; }
#gbtn { min-height: 44px; }
.share { margin-left: auto; font: 600 14px "Hanken Grotesk", sans-serif; background: var(--bg); border: 1px solid var(--line); color: var(--ink); border-radius: 999px; padding: 8px 16px; min-height: 38px; cursor: pointer; }
.share:hover { border-color: var(--accent); color: var(--accent); }
.hidden { display: none !important; }
.tabs { display: flex; gap: 6px; border-bottom: 1px solid var(--line); margin: 0 0 18px; }
.tab { font: 600 15px "Hanken Grotesk", sans-serif; background: none; border: none; border-bottom: 2px solid transparent; color: var(--ink-soft); padding: 10px 14px; min-height: 44px; cursor: pointer; margin-bottom: -1px; }
.tab span { font-weight: 500; font-size: 13px; opacity: .75; }
.tab.on { color: var(--ink-head); border-bottom-color: var(--accent); }
.tab:focus-visible { outline: 2px solid var(--accent); outline-offset: 2px; }
h2.sec { font: 600 15px "Hanken Grotesk", sans-serif; color: var(--ink-soft); margin: 0 0 12px; }
a.card.app { display: block; text-decoration: none; color: inherit; }
</style>
</head>
<body>
<div class="wrap">
  <a class="home" href="/">← Small Business Tools</a>
  <h1>Members</h1>
  <div id="out"><p class="lede">Sign in with your Google account to open your apps.</p><div id="gbtn"></div></div>
</div>
<script src="https://accounts.google.com/gsi/client" async defer onload="gInit()"></script>
<script>
// www. or the *.pages.dev preview → the one registered address, so Google's sign-in cookie and return address match (redirect_uri_mismatch, 2026-11-20)
if (location.hostname !== "aisystemimplementation.com" && /aisystemimplementation\.com$/.test(location.hostname)) location.replace("https://aisystemimplementation.com" + location.pathname + location.search);
const WORKER_URL = "https://jolly-darkness-5dcc.trailnotes2026.workers.dev";
const CLIENT_ID = "903072898801-vccprv4hqfltslrdsl7b2dm3s6v0lenj.apps.googleusercontent.com";
const out = document.getElementById("out");
const esc = s => String(s == null ? "" : s).replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" }[c]));
const store = { get: k => { try { return localStorage.getItem(k); } catch (e) { return null; } }, set: (k, v) => { try { v == null ? localStorage.removeItem(k) : localStorage.setItem(k, v); } catch (e) {} } };
async function call(extra) {
  const r = await fetch(WORKER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "member", ...extra }) });
  return r.json();
}
// In-app browsers (Instagram, Facebook, Messenger, LinkedIn, TikTok, Snapchat, Android WebViews …): Google refuses sign-in there, which showed
// as a blank white screen (operator 2026-11-20). Detect them and send the member to their real browser instead of the Google button.
const UA = navigator.userAgent || "", IS_ANDROID = /Android/i.test(UA), IS_IOS = /iPhone|iPad|iPod/i.test(UA);
const IN_APP = /FBAN|FBAV|FB_IAB|Instagram|Messenger|LinkedInApp|Line\/|Twitter|TikTok|musical_ly|Snapchat|Pinterest/i.test(UA)
  || (IS_ANDROID && /; wv\)/.test(UA)) || (IS_IOS && !/Safari\//.test(UA) && !/CriOS|FxiOS|EdgiOS/.test(UA));
function inAppView() {
  const here = location.origin + "/members/";
  const chrome = "intent://" + here.replace(/^https?:\/\//, "") + "#Intent;scheme=https;package=com.android.chrome;end";
  out.innerHTML = `<div class="card"><b>Open this page in ${IS_IOS ? "Safari" : "Chrome"} to sign in.</b>
    <p style="margin:8px 0 16px;color:var(--ink-soft);">You opened this link inside another app, and Google doesn't allow sign-in there.
    ${IS_IOS ? "Tap the <b>⋯</b> or share menu and choose <b>Open in Safari</b> (or Open in browser), or copy the link and paste it into Safari." : "Tap the button below, or use the app's <b>⋮</b> menu → <b>Open in Chrome</b> / Open in browser."}</p>
    ${IS_ANDROID ? `<a class="share" style="display:inline-block;text-decoration:none;margin:0 8px 8px 0;" href="${esc(chrome)}">Open in Chrome</a>` : ""}
    <button class="share" style="margin:0;" onclick="navigator.clipboard.writeText('${here}').then(()=>{this.textContent='✓ Link copied'}).catch(()=>{this.textContent='${here}'})">Copy link</button></div>`;
}
function signInView(note) {
  if (IN_APP) return inAppView();
  out.innerHTML = (note ? `<div class="msg">${note}</div>` : "") + `<p class="lede">Sign in with your Google account to open your apps.</p><div id="gbtn"></div>`;
  renderButton();
}
function renderButton() {
  const el = document.getElementById("gbtn"); if (!el || !window.google || !google.accounts) return;
  google.accounts.id.renderButton(el, { theme: "outline", size: "large", text: "continue_with", shape: "pill", width: 280 });
}
// Tabs (operator 2026-11-24: "the members page might have a list of reports or report tabs"): 📊 Reports (newest run first) · Apps.
// Only the tabs the member has; the last tab picked is remembered in this browser.
let _mbD = null;
function appsView(d, tab) {
  _mbD = d; const pic = store.get("mb_pic");
  const reports = d.apps.filter(a => a.kind === "report").sort((a, b) => String(b.at || "").localeCompare(String(a.at || ""))), apps = d.apps.filter(a => a.kind !== "report");
  const tabs = [["reports", "📊 Reports", reports], ["apps", "Apps", apps]].filter(t => t[2].length);
  tab = tab || store.get("mb_tab"); if (!tabs.some(t => t[0] === tab)) tab = tabs.length ? tabs[0][0] : "";
  const when = at => { const x = new Date(at); return isNaN(x) ? "" : x.toLocaleDateString(undefined, { month: "short", day: "numeric", year: "numeric" }); };
  const reportCard = a => `<a class="card app" href="${esc(a.path)}"><div class="t">${esc(a.name)}</div><div class="m">${esc(["Research as of " + when(a.at), a.hub].filter(Boolean).join(" · "))}</div><div class="go">Open report →</div></a>`;
  const appCard = a => `<div class="card app"><a href="${esc(a.path)}" style="display:block;text-decoration:none;color:inherit;"><div class="t">${esc(a.name)}</div><div class="m">${esc([d.superadmin && a.client ? "Client: " + a.client : "", a.kind === "studio" ? "Script Studio" : "", a.hub].filter(Boolean).join(" · "))}</div></a>
        <div style="display:flex;gap:16px;align-items:center;margin-top:12px;"><a class="go" href="${esc(a.path)}" style="text-decoration:none;margin:0;">Open →</a>${d.superadmin ? `<button class="share" onclick="shareMembers(this)">Share with client</button>` : ""}</div></div>`;
  const bar = tabs.length > 1 ? `<div class="tabs" role="tablist">${tabs.map(t => `<button role="tab" aria-selected="${t[0] === tab}" class="tab${t[0] === tab ? " on" : ""}" onclick="store.set('mb_tab','${t[0]}');appsView(_mbD,'${t[0]}')">${t[1]} <span>${t[2].length}</span></button>`).join("")}</div>` : "";
  const list = tab === "reports" ? reports.map(reportCard).join("") : tab === "apps" ? apps.map(appCard).join("") : "";
  out.innerHTML = `<div class="who">${pic ? `<img src="${esc(pic)}" alt="">` : ""}<span>${esc(d.name || d.email)}${d.superadmin ? " · Superadmin — every client's apps" : ""}</span><button onclick="signOut()">Sign out</button></div>`
    + (tabs.length ? bar + (tabs.length === 1 ? `<h2 class="sec">${tabs[0][1]}</h2>` : "") + list : `<div class="card">You're signed in, but nothing is set up for you yet.</div>`);
}
async function onCredential(resp) {
  out.innerHTML = `<p class="lede">Signing you in…</p>`;
  try {
    const d = await call({ op: "google", credential: resp.credential });
    if (d.error) return signInView(esc(d.error));
    if (!d.ok && d.code === "not_member") return signInView(`<b>${esc(d.email)}</b> isn't on the members list yet. If you were invited with a different Google account, sign in with that one.`);
    store.set("mb_token", d.token);
    try { store.set("mb_pic", JSON.parse(atob(resp.credential.split(".")[1].replace(/-/g, "+").replace(/_/g, "/"))).picture || null); } catch (e) {}
    if (REPORT_ID) return reportView(d.token);
    appsView(d);
  } catch (e) { signInView("Sign-in didn't go through. Try again."); }
}
// Superadmin: share the members page with a client — the phone's share sheet (Messages, email…), else copy. The client signs in with
// their own Google account; the link itself carries no access.
async function shareMembers(btn) {
  const url = location.origin + "/members/", text = "Here's your members page — tap Continue with Google and sign in with the email I have for you:";
  try { if (navigator.share) { await navigator.share({ title: "Members", text, url }); return; } } catch (e) { if (e && e.name === "AbortError") return; }
  try { await navigator.clipboard.writeText(text + " " + url); btn.textContent = "✓ Copied"; } catch (e) { btn.textContent = url; }
  setTimeout(() => { btn.textContent = "Share with client"; }, 2500);
}
// 📊 a shared research report (2026-11-24): /members/?report=<id> → worker member op "report" → rendered here, members only
const REPORT_ID = new URLSearchParams(location.search).get("report") || "";
async function reportView(tok, at) {
  store.set("mb_tab", "reports"); out.innerHTML = '<p class="lede">Loading the report…</p>'; document.querySelector(".wrap").style.maxWidth = "820px";
  try { const d = await call({ op: "report", token: tok, assetId: REPORT_ID, at });
    if (d.code === "signed_out") { store.set("mb_token", null); return signInView("Please sign in again."); }
    if (!d.ok) { out.innerHTML = '<div class="msg">' + esc(d.error || "This report isn't available.") + '</div><a class="home" href="/members/">← Your apps</a>'; return; }
    const V = d.versions || [];
    const pick = V.length > 1 ? '<select class="share" style="margin-left:auto" onchange="reportView(store.get(\'mb_token\'), this.value)">' + V.map(v => '<option value="' + esc(v.at) + '"' + (v.at === d.report.at ? " selected" : "") + ">" + esc(new Date(v.at).toLocaleString()) + (v.premium ? " · ★" : "") + "</option>").join("") + "</select>" : "";
    out.innerHTML = '<div class="who"><a class="home" href="/members/">← All reports</a>' + pick + "</div>" + reportHtml(d.report);
    rnAttach({ key: REPORT_ID, ver: d.report.at, api: (sub, p) => call(Object.assign({ op: "notes", token: store.get("mb_token"), assetId: REPORT_ID, sub }, p)) });
  } catch (e) { out.innerHTML = '<div class="msg">Couldn\'t reach the server. Try again in a minute.</div>'; }
}
// 📊 Report renderer — the same function on the dash (Hub Dash 2 › 📊 Report) and the members page (aisystemimplementation.com/members/?report=).
// Theme-neutral: inherits the page's text colour; borders and muted text are translucent so both light and dark pages read.
// 🖍 Highlights (2026-11-24): select text in any section → 🖍 Highlight → numbered mark in the text + a numbered item in Notes with an
// editable note (rnAttach wires it; the page supplies the api). Shared by everyone who can open the report, kept across runs.
function reportHtml(R) {
  const e = s => String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]));
  const A = R.analysis || {}, S = R.sources || [], byN = new Map(S.map(s => [s.n, s]));
  const refs = L => (L || []).filter(n => byN.has(n)).map(n => `<a class="rp-ref" href="${e(byN.get(n).url)}" target="_blank" rel="noopener" title="${e(byN.get(n).publisher || byN.get(n).url)}">${n}</a>`).join('');
  const pts = L => (L || []).length ? `<ul>${L.map(p => `<li>${e(p.point)} ${refs(p.refs)}</li>`).join('')}</ul>` : '<p class="rp-mute">—</p>';
  const kv = o => Object.entries(o || {}).filter(x => x[1]).map(([k, v]) => `<div class="rp-kv"><b>${e(k)}</b><div>${e(v).replace(/\n/g, '<br>')}</div></div>`).join('') || '<p class="rp-mute">nothing stored yet</p>';
  const sec = (key, h, body) => `<section class="rp-sec" data-sec="${key}"><h3>${h}</h3>${body}</section>`;
  const d = new Date(R.at);
  return `<style>.rp{line-height:1.55}.rp h2{margin:0 0 4px;font-size:22px}.rp h3{font-size:13px;letter-spacing:.06em;text-transform:uppercase;margin:0 0 8px;opacity:.75}
    .rp-sec{border-top:1px solid rgba(128,128,128,.28);padding:14px 0}.rp ul{margin:0;padding-left:20px}.rp li{margin:4px 0}.rp-mute{opacity:.6;margin:0}
    .rp-ref{display:inline-block;min-width:18px;padding:0 5px;margin-left:3px;border-radius:9px;font-size:11px;line-height:17px;text-align:center;text-decoration:none;border:1px solid rgba(128,128,128,.45);color:inherit}
    .rp-kv{margin:0 0 10px}.rp-kv b{display:block;font-size:12.5px;opacity:.75}.rp-badge{display:inline-block;font-size:11px;font-weight:700;padding:2px 8px;border-radius:999px;border:1px solid rgba(128,128,128,.45);margin-left:6px}
    .rp-src{display:grid;grid-template-columns:34px minmax(0,1fr);gap:4px 8px;font-size:13.5px;padding:6px 0;border-top:1px dashed rgba(128,128,128,.25)}.rp-src a{color:inherit}
    .rp details{margin-top:8px}.rp summary{cursor:pointer;font-size:13px;opacity:.8}.rp pre{white-space:pre-wrap;font-size:12px;margin:6px 0 0}
    mark.rp-hl{background:rgba(250,204,21,.42);color:inherit;border-radius:2px;padding:0 1px;cursor:pointer}
    mark.rp-hl[data-first]::before{content:attr(data-n);display:inline-block;font-size:10px;font-weight:700;line-height:14px;min-width:14px;text-align:center;border-radius:7px;background:#ca8a04;color:#fff;margin-right:3px;vertical-align:1px}
    .rp-hlbtn{position:fixed;z-index:3000;display:none;font:600 14px system-ui,sans-serif;padding:8px 14px;min-height:40px;border-radius:999px;border:none;background:#ca8a04;color:#fff;box-shadow:0 4px 16px rgba(0,0,0,.3);cursor:pointer}
    .rp-nl{margin:6px 0 0;padding-left:26px}.rp-nl>li{margin:0 0 14px}.rp-nl>li::marker{font-weight:700;color:#ca8a04}
    .rp-nq{font-size:13.5px;opacity:.85}.rp-nq a{color:inherit;text-decoration:none;border-bottom:1px dashed rgba(128,128,128,.6)}
    .rp-nt{display:block;width:100%;box-sizing:border-box;margin:6px 0 2px;min-height:40px;font:inherit;font-size:14.5px;line-height:1.5;padding:7px 9px;border:1px solid rgba(128,128,128,.4);border-radius:8px;background:transparent;color:inherit;resize:vertical}
    .rp-nt:focus{outline:2px solid #ca8a04;outline-offset:1px}.rp-nm{font-size:12px;opacity:.6;display:flex;gap:10px;align-items:center;flex-wrap:wrap}
    .rp-nm button{font:inherit;background:none;border:none;color:inherit;text-decoration:underline;cursor:pointer;padding:4px 0}.rp-flash{animation:rpf 1.2s}@keyframes rpf{0%{background:rgba(250,204,21,.9)}}</style>
  <div class="rp" data-rn="1">
    <h2>${e(R.title && R.title.name)}</h2>
    <div class="rp-mute">${e(R.hub || '')} · research as of ${e(isNaN(d) ? R.at : d.toLocaleString(undefined, { dateStyle: 'medium', timeStyle: 'short' }))}${R.premium ? '<span class="rp-badge">★ Premium</span>' : '<span class="rp-badge">Free</span>'} · ${S.length} sources</div>
    ${sec('summary', 'Summary', A.summary ? `<p style="margin:0">${e(A.summary)}</p>` : '<p class="rp-mute">The analysis did not run — the research below is still current.</p>')}
    ${sec('moving', "What's moving", pts(A.moving))}
    ${sec('demand', 'Search demand', (A.demand ? `<p style="margin:0 0 8px">${e(A.demand)}</p>` : '') + `${(R.keywords || {}).niche ? `<div style="font-size:13px;margin:0 0 4px"><b>Niche keywords:</b> ${e(R.keywords.niche)}</div>` : ''}<div class="rp-mute" style="font-size:13px">${(R.keywords || {}).niche ? 'All keywords (niche first, then the topic)' : 'Topic keywords'}: ${e(((R.keywords || {}).list || []).join(', ') || 'none')}</div>` + ((R.keywords || {}).demand ? `<details><summary>Keyword store figures</summary><pre>${e(R.keywords.demand)}</pre></details>` : ''))}
    ${sec('audience', 'What the audience is asking', ((A.audience || []).length ? `<ul>${A.audience.map(q => `<li>${e(q)}</li>`).join('')}</ul>` : '<p class="rp-mute">—</p>') +
      Object.entries(R.audience || {}).map(([k, L]) => `<details><summary>${e(k)} (${L.length})</summary><ul>${L.map(x => `<li>${x.url ? `<a href="${e(x.url)}" target="_blank" rel="noopener" style="color:inherit">${e(x.t)}</a>` : e(x.t)}${x.v ? ` <span class="rp-mute">· ${Number(x.v).toLocaleString()}/mo</span>` : ''}${x.meta ? ` <span class="rp-mute">· ${e(x.meta)}</span>` : ''}</li>`).join('')}</ul></details>`).join(''))}
    ${sec('opportunities', 'Opportunities', pts(A.opportunities))}
    ${sec('risks', 'Risks & pressures', pts(A.risks))}
    ${sec('next', 'Titles worth making next', (A.nextTitles || []).length ? `<ul>${A.nextTitles.map(t => `<li><b>${e(t.title)}</b> <span class="rp-mute">· ${e(t.keyword)}</span><br>${e(t.why)}</li>`).join('')}</ul>` : '<p class="rp-mute">—</p>')}
    ${sec('gaps', 'Gaps in the research', (A.gaps || []).length ? `<ul>${A.gaps.map(g => `<li>${e(g)}</li>`).join('')}</ul>` : '<p class="rp-mute">—</p>')}
    ${sec('sources', 'Sources', S.length ? S.map(s => `<div class="rp-src"><span class="rp-ref" style="margin:2px 0 0">${s.n}</span><div><a href="${e(s.url)}" target="_blank" rel="noopener">${e(s.claim || s.url)}</a>${s.why ? `<div>${e(s.why)}</div>` : ''}<div class="rp-mute" style="font-size:12px">${e([s.publisher, s.date, s.from].filter(Boolean).join(' · '))}</div></div></div>`).join('') : '<p class="rp-mute">No sources found this run.</p>')}
    ${sec('underneath', 'The research underneath', `<details><summary>Title research${R.title && R.title.outOfSync ? ' (keywords out of sync — not regenerated yet)' : ''}</summary>${kv(R.title && R.title.research)}</details>
      <details><summary>Niche${R.product && R.product.name ? ' — ' + e(R.product.name) : ''}</summary>${kv(Object.assign({}, (R.product || {}).facts, (R.product || {}).research))}</details>
      <details><summary>Hub research</summary>${kv(R.hubResearch)}</details>`)}
    <section class="rp-sec rp-notes" data-sec="notes"><h3>Notes</h3><p class="rp-mute rp-nh" style="font-size:13px">Select any text in the report and tap 🖍 Highlight — it gets a number here, with room for a note.</p><ol class="rp-nl"></ol></section>
  </div>`;
}
// ── 🖍 highlight + notes wiring. rnAttach({key, api, ver}) after the report HTML is on the page; api(sub, payload) → {ok, items|item} | {error}
const RN = { key: '', items: null, api: null, root: null, ver: '', pending: null, timers: {} };
function rnEsc(s) { return String(s == null ? '' : s).replace(/[&<>"']/g, c => ({ '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c])); }
function rnAttach(cfg) {
  const root = cfg.root || document.querySelector('.rp[data-rn]'); if (!root) return;
  if (RN.key !== cfg.key) { RN.key = cfg.key; RN.items = null; }
  RN.api = cfg.api; RN.ver = cfg.ver || ''; RN.root = root; rnBind();
  if (root.dataset.rnb) return; root.dataset.rnb = '1';
  root.addEventListener('click', ev => { const m = ev.target.closest('mark.rp-hl'); if (m) { ev.preventDefault(); rnGo(m.dataset.id, 'note'); } });
  root.addEventListener('input', ev => { const t = ev.target.closest('.rp-nt'); if (t) rnNoteInput(t); });
  if (RN.items) rnPaint(); else rnLoad();
}
async function rnLoad() { const r = await RN.api('list', {}).catch(x => ({ error: x.message })); RN.items = (r && r.items) || []; rnPaint(r && r.error); }
function rnFind(scope, text) {   // first occurrence of the words (spacing ignored) in this section → [startNode, startOffset, endNode, endOffset]

    const b = n.parentElement.closest('li,p,div,pre'); if (b !== blk && !sp && map.length) { s += ' '; map.push(map[map.length - 1]); sp = true; } blk = b;
    for (let i = 0; i < n.data.length; i++) { const c = n.data[i]; if (/\s/.test(c)) { if (!sp) { s += ' '; map.push([n, i]); sp = true; } } else { s += c.toLowerCase(); map.push([n, i]); sp = false; } } }
  const k = s.indexOf(want); if (k < 0) return null; const a = map[k], z = map[k + want.length - 1]; return [a[0], a[1], z[0], z[1] + 1];

function rnWrap(f, num, id) {

    const m = document.createElement('mark'); m.className = 'rp-hl'; m.dataset.n = num; m.dataset.id = id; m.title = 'Note ' + num; if (first) { m.dataset.first = '1'; first = false; }
    mid.parentNode.insertBefore(m, mid); m.appendChild(mid); });

}
function rnPaint(err) {
  const root = RN.root; if (!root || !document.contains(root)) return;

    for (const s of scopes) { const f = rnFind(s, it.text); if (f && rnWrap(f, i + 1, it.id)) { found[it.id] = true; break; } } });
  const when = t => { const d = new Date(t); return isNaN(d) ? '' : d.toLocaleDateString(undefined, { month: 'short', day: 'numeric' }); };
  const ol = root.querySelector('.rp-nl'), hint = root.querySelector('.rp-nh'); if (!ol) return;
  if (hint) hint.textContent = err ? 'Notes could not load: ' + err : L.length ? 'Select more text and tap 🖍 Highlight to add to this list.' : 'Select any text in the report and tap 🖍 Highlight — it gets a number here, with room for a note.';
  ol.innerHTML = L.map(it => `<li id="rpn-${rnEsc(it.id)}"><div class="rp-nq"><a href="#" onclick="rnGo('${rnEsc(it.id)}','text');return false">“${rnEsc(it.text.length > 220 ? it.text.slice(0, 220) + '…' : it.text)}”</a>${found[it.id] ? '' : ' <span class="rp-mute">(not in this version of the report)</span>'}</div>
      <textarea class="rp-nt" data-id="${rnEsc(it.id)}" rows="2" placeholder="Add a note…" aria-label="Note ${L.indexOf(it) + 1}">${rnEsc(it.note || '')}</textarea>
      <div class="rp-nm"><span>${rnEsc(it.byName || '')} · ${when(it.at)}${it.editedBy ? ' · edited by ' + rnEsc(it.editedBy) + ' ' + when(it.editedAt) : ''}</span><span class="rp-ns" data-id="${rnEsc(it.id)}"></span><button onclick="rnRemove('${rnEsc(it.id)}')">Remove</button></div></li>`).join('');
}
function rnGo(id, to) {

  el.scrollIntoView({ behavior: 'smooth', block: 'center' }); el.classList.add('rp-flash'); setTimeout(() => el.classList.remove('rp-flash'), 1300);

}
function rnNoteInput(t) {
  const id = t.dataset.id, it = (RN.items || []).find(x => x.id === id); if (!it) return; it.note = t.value;
  const st = RN.root.querySelector('.rp-ns[data-id="' + id + '"]'); if (st) st.textContent = 'saving…';
  clearTimeout(RN.timers[id]); RN.timers[id] = setTimeout(async () => { const r = await RN.api('edit', { id, note: t.value }).catch(x => ({ error: x.message }));
    if (st) st.textContent = r && r.ok ? '✓ saved' : '✗ ' + ((r && r.error) || 'not saved'); if (r && r.item) Object.assign(it, r.item, { note: t.value }); }, 800);
}
async function rnRemove(id) {

  if (!r || r.error) { const st = RN.root.querySelector('.rp-ns[data-id="' + id + '"]'); if (st) st.textContent = '✗ ' + ((r && r.error) || 'not removed'); return; }

function rnBtn() { let b = document.getElementById('rpHlBtn'); if (!b) { b = document.createElement('button'); b.id = 'rpHlBtn'; b.className = 'rp-hlbtn'; b.type = 'button'; b.textContent = '🖍 Highlight';
    b.addEventListener('mousedown', e => e.preventDefault()); b.addEventListener('click', rnAdd); document.body.appendChild(b); } return b; }
function rnBind() { if (RN.bound) return; RN.bound = true; let tm; document.addEventListener('selectionchange', () => { clearTimeout(tm); tm = setTimeout(rnSel, 120); }); window.addEventListener('scroll', () => { const b = document.getElementById('rpHlBtn'); if (b) b.style.display = 'none'; }, true); }
function rnSel() {

  if (!RN.root || !document.contains(RN.root) || !sel || !sel.rangeCount || sel.isCollapsed) return hide();
  const r = sel.getRangeAt(0), c = r.commonAncestorContainer, el = c.nodeType === 3 ? c.parentElement : c, sec = el && el.closest('.rp-sec');
  if (!sec || !RN.root.contains(sec) || sec.classList.contains('rp-notes')) return hide();
  const text = sel.toString().replace(/\s+/g, ' ').trim(); if (text.length < 3 || text.length > 600) return hide();
  const rc = r.getBoundingClientRect(), below = rc.top < 70; RN.pending = { sec: sec.dataset.sec, text };
  b.style.display = 'block'; b.style.left = Math.max(8, Math.min(window.innerWidth - 150, rc.left + rc.width / 2 - 65)) + 'px'; b.style.top = (below ? rc.bottom + 10 : rc.top - 50) + 'px';
}
async function rnAdd() {
  const p = RN.pending, b = rnBtn(); if (!p) return; b.textContent = 'Saving…';
  const r = await RN.api('add', { sec: p.sec, text: p.text, ver: RN.ver }).catch(x => ({ error: x.message }));
  b.textContent = '🖍 Highlight'; b.style.display = 'none'; RN.pending = null; try { window.getSelection().removeAllRanges(); } catch (e) {}
  if (!r || r.error) { alertless((r && r.error) || 'Highlight not saved'); return; }
  RN.items = r.items || [...(RN.items || []), r.item]; rnPaint(); rnGo(r.item.id, 'note');
}
function alertless(msg) { const h = RN.root && RN.root.querySelector('.rp-nh'); if (h) { h.textContent = '✗ ' + msg; h.scrollIntoView({ behavior: 'smooth', block: 'center' }); } }
function signOut() { store.set("mb_token", null); store.set("mb_pic", null); try { google.accounts.id.disableAutoSelect(); } catch (e) {} signInView(); }
let gReady = false;
function gInit() {
  // redirect, not pop-up: on phones Google's pop-up tab came up blank white (2026-11-20). Google posts the sign-in to /members/login,
  // which hands it back to this page (see the start-up block below).
  // login_uri is the exact address registered in Google Cloud (Authorized redirect URIs) — never www. or any other host

  gReady = true; if (!store.get("mb_token") && !IN_APP) renderButton();

(async () => {
  let cred = null, err = null; try { cred = sessionStorage.getItem("mb_cred"); err = sessionStorage.getItem("mb_err"); sessionStorage.removeItem("mb_cred"); sessionStorage.removeItem("mb_err"); } catch (e) {}
  if (cred) return onCredential({ credential: cred });

  const tok = store.get("mb_token"); if (!tok) { if (IN_APP) inAppView(); return; }

  if (REPORT_ID) return reportView(tok);
  try { const d = await call({ op: "me", token: tok }); if (d.ok) return appsView(d); store.set("mb_token", null); signInView(d.code === "not_member" ? "Your account isn't on the members list any more." : ""); }
