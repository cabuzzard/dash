<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Creative Flow Guitar — a new guitar session every week</title>
<meta name="description" content="One guitar session a week, recorded raw — the tone, the room, the take left as it happened. Download the MP3 and the live recording, study it, play along.">
<meta property="og:title" content="Creative Flow Guitar">
<meta property="og:description" content="A new guitar session every week. Real playing, real feel — MP3s and live recordings you can own, study, and play along with.">
<meta property="og:type" content="website">
<meta name="robots" content="index,follow">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Hanken+Grotesk:wght@400;500;600&family=Space+Mono:wght@400;700&display=swap" rel="stylesheet">
<script src="https://challenges.cloudflare.com/turnstile/v0/api.js" async defer></script>
<style>
/* ============================================================
   DESIGN TOKENS — EDIT PER HUB
   Change colour / type / logo here. Everything below this block
   is shared layout and must stay identical across every hub.
   Also swap the Google Fonts <link> above to match --font-*.
   ============================================================ */
:root{
  --bg:        #1a1512;   /* walnut / record-black — an after-dark listening room */
  --surface:   #241d18;   /* raised warm panel */
  --ink:       #f1e8d9;   /* warm lamplight cream */
  --ink-head:  #f1e8d9;   /* headings (h1-h3) — defaults to --ink */
  --ink-soft:  #b3a488;   /* dim warm grey */
  --line:      rgba(241,232,217,.14);
  --sea:       #e0913f;   /* primary — tube-amp amber glow */
  --deep:      #120e0b;   /* deepest band */
  --deep-ink:  #e9dcc7;   /* text on --deep */
  --accent:    #c4472f;   /* worn label red — used once, loudly */
  --paper:     #241d18;

  --font-display: "DM Serif Display", Georgia, serif;
  --font-body:    "Hanken Grotesk", system-ui, sans-serif;
  --font-mono:    "Space Mono", ui-monospace, monospace;

  --logo-text: "Creative Flow Guitar";
  --logo-img:  none;
}

/* ============================================================
   SHARED LAYOUT — do not edit per hub
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{
  background:var(--bg);color:var(--ink);
  font-family:var(--font-body);font-size:1.0625rem;line-height:1.62;
  font-weight:400;-webkit-font-smoothing:antialiased;
}
img{max-width:100%;display:block}
a{color:inherit}
:focus-visible{outline:2px solid var(--sea);outline-offset:3px;border-radius:2px}

.wrap{width:min(1120px,100% - 2.5rem);margin-inline:auto}

.eyebrow{
  font-family:var(--font-mono);font-weight:700;
  font-size:.78rem;letter-spacing:.16em;text-transform:uppercase;
  color:var(--sea);
}

h1,h2,h3{font-family:var(--font-display);font-weight:600;line-height:1.04;letter-spacing:-.015em;color:var(--ink-head)}

.site-head{
  position:sticky;top:0;z-index:20;background:color-mix(in srgb,var(--bg) 88%,transparent);
  backdrop-filter:blur(8px);border-top:3px solid var(--sea);border-bottom:1px solid var(--line);
}
.site-head .wrap{display:flex;align-items:center;gap:1.5rem;height:64px}
.brand{font-family:var(--font-display);font-weight:700;font-size:1.15rem;letter-spacing:-.02em;text-decoration:none;white-space:nowrap}
.brand .brand-mark{height:26px;width:auto}
.nav{margin-left:auto;display:flex;gap:1.6rem}
.nav a{font-family:var(--font-mono);font-size:.75rem;letter-spacing:.09em;text-transform:uppercase;text-decoration:none;color:var(--ink-soft)}
.nav a:hover{color:var(--ink)}
.nav-cta{
  font-family:var(--font-mono);font-size:.72rem;letter-spacing:.1em;text-transform:uppercase;
  text-decoration:none;padding:.5rem .85rem;border:1px solid var(--sea);border-radius:999px;color:var(--sea);
}
.nav-cta:hover{background:var(--sea);color:var(--bg)}
.nav-toggle{display:none}

.ribbon{background:var(--deep);overflow:hidden}
.ribbon-track{
  display:flex;flex-wrap:wrap;gap:.5rem 2.25rem;padding:.7rem 0;
  font-family:var(--font-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;color:var(--deep-ink);
}
.ribbon-track span{display:inline-flex;align-items:center;gap:.55rem;white-space:nowrap}
.ribbon-track span::before{content:"";width:7px;height:7px;background:color-mix(in srgb,var(--accent) 72%,#fff);border-radius:1px;transform:rotate(45deg);flex:none}

.hero{padding:clamp(3.5rem,9vw,7rem) 0 clamp(3rem,7vw,5rem);background:color-mix(in srgb,var(--sea) 7%,var(--bg));border-bottom:4px solid var(--sea)}
.hero .eyebrow{display:inline-block;margin-bottom:1.4rem;background:var(--sea);color:var(--bg);padding:.42rem .8rem;border-radius:999px}
.hero h1{font-size:clamp(2.6rem,6.2vw,4.8rem);max-width:16ch}
.hero p{margin-top:1.5rem;max-width:46ch;font-size:1.15rem;color:var(--ink-soft)}
.hero-actions{margin-top:2.4rem;display:flex;flex-wrap:wrap;gap:1rem;align-items:center}
.btn{
  font-family:var(--font-mono);font-size:.8rem;letter-spacing:.08em;text-transform:uppercase;
  text-decoration:none;cursor:pointer;border:none;
  padding:.95rem 1.5rem;border-radius:999px;background:var(--accent);color:#fff;
  transition:transform .12s ease;
}
.btn:hover{transform:translateY(-2px)}
.btn-ghost{background:none;color:var(--ink);border:1px solid var(--line);padding:.95rem 1.5rem}
.btn-ghost:hover{border-color:var(--ink)}

.sec{padding:clamp(3rem,6vw,4.5rem) 0;border-top:1px solid var(--line)}
.sec-head{display:flex;align-items:baseline;gap:1rem;margin-bottom:2rem}
.sec-head h2{font-size:clamp(1.5rem,3vw,2rem);color:var(--sea)}
.sec-head .eyebrow{flex:none}
.sec-note{color:var(--ink-soft);max-width:42ch;margin-left:auto;text-align:right;font-size:.95rem}

.grid{display:grid;gap:1.25rem}
.grid.cols-3{grid-template-columns:repeat(3,1fr)}
.grid.cols-2{grid-template-columns:repeat(2,1fr)}

.card{
  background:var(--surface);border:1px solid var(--line);border-top:3px solid var(--sea);border-radius:4px 4px 14px 14px;
  padding:1.5rem;display:flex;flex-direction:column;gap:.65rem;text-decoration:none;color:inherit;
  transition:border-color .15s ease,transform .15s ease;
}
a.card:hover{border-color:var(--sea);transform:translateY(-3px)}
.card .kicker{font-family:var(--font-mono);font-size:.68rem;letter-spacing:.1em;text-transform:uppercase;color:var(--sea)}
.card h3{font-size:1.22rem;font-weight:600}
.card p{font-size:.95rem;color:var(--ink-soft)}
.card .more{margin-top:auto;font-family:var(--font-mono);font-size:.72rem;letter-spacing:.08em;text-transform:uppercase;color:var(--ink)}

.dispatch{border-top:1px solid var(--line)}
.dispatch li{list-style:none;border-bottom:1px solid var(--line)}
.dispatch a{display:grid;grid-template-columns:5.5rem 1fr auto;gap:1.25rem;align-items:baseline;padding:1.1rem 0;text-decoration:none}
.dispatch a:hover .d-title{color:var(--sea)}
.dispatch .d-date{font-family:var(--font-mono);font-size:.78rem;color:var(--ink-soft)}
.dispatch .d-title{font-family:var(--font-display);font-size:1.1rem;font-weight:500}
.dispatch .d-src{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-soft);text-transform:uppercase;letter-spacing:.06em}

.empty{
  border:1px dashed var(--line);border-radius:14px;padding:2.25rem 1.75rem;
  color:var(--ink-soft);font-size:1rem;max-width:52ch;
}
.empty strong{display:block;font-family:var(--font-display);font-weight:600;color:var(--ink);font-size:1.05rem;margin-bottom:.4rem}

.report{background:var(--deep);color:var(--deep-ink);border:none}
.report .eyebrow{color:color-mix(in srgb,#ffffff 60%,var(--sea))}
.report h2{color:#fff;max-width:18ch}
.report p{color:var(--deep-ink);max-width:44ch;margin-top:1rem}
.signup{margin-top:2rem;display:flex;flex-wrap:wrap;gap:.75rem;max-width:520px}
.signup input[type=email]{
  flex:1 1 240px;background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.22);
  color:#fff;font:inherit;padding:.95rem 1.1rem;border-radius:999px;
}
.signup input[type=email]::placeholder{color:rgba(255,255,255,.5)}
.signup .btn{flex:0 0 auto}
.signup-note{margin-top:.9rem;font-size:.82rem;color:rgba(255,255,255,.55)}
.report-link{margin-top:.7rem}
.report-link a{color:#fff;font-family:var(--font-mono);font-size:.78rem;letter-spacing:.05em;text-decoration:none;border-bottom:1px solid rgba(255,255,255,.4);padding-bottom:1px}
.report-link a:hover{border-color:#fff}
.form-msg{margin-top:1rem;font-family:var(--font-mono);font-size:.8rem;letter-spacing:.04em}
.form-msg.ok{color:#8fe3b0}.form-msg.err{color:#ff9b7a}
.cf-turnstile{margin-top:.25rem}

.elsewhere .wrap{display:flex;flex-wrap:wrap;align-items:center;gap:1rem 2rem}
.elsewhere .eyebrow{flex:none}
.social-row{display:flex;flex-wrap:wrap;gap:.6rem}
.social-row a{
  font-family:var(--font-mono);font-size:.74rem;letter-spacing:.08em;text-transform:uppercase;
  text-decoration:none;padding:.55rem 1rem;border:1px solid var(--line);border-radius:999px;color:var(--ink-soft);
}
.social-row a:hover{border-color:var(--ink);color:var(--ink)}

.site-foot{border-top:1px solid var(--line);padding:2.5rem 0 3.5rem}
.site-foot .wrap{display:flex;flex-wrap:wrap;justify-content:space-between;gap:1rem;align-items:baseline}
.site-foot .f-brand{font-family:var(--font-display);font-weight:700}
.site-foot small{color:var(--ink-soft);font-size:.85rem;display:block;margin-top:.3rem;max-width:40ch}
.site-foot .f-legal{font-family:var(--font-mono);font-size:.72rem;color:var(--ink-soft);letter-spacing:.05em}

@media (prefers-reduced-motion:no-preference){
  .reveal{opacity:0;transform:translateY(14px);transition:opacity .5s ease,transform .5s ease}
  .reveal.in{opacity:1;transform:none}
}

@media (max-width:860px){
  .grid.cols-3{grid-template-columns:1fr 1fr}
  .sec-note{display:none}
}
@media (max-width:640px){
  body{font-size:1rem}
  .nav{display:none;position:absolute;top:64px;left:0;right:0;flex-direction:column;gap:0;background:var(--bg);border-bottom:1px solid var(--line);margin:0}
  .nav.open{display:flex}
  .nav a{padding:1rem 1.25rem;border-top:1px solid var(--line)}
  .site-head .wrap{gap:.75rem}
  .nav-cta{order:2;margin-left:auto}
  .nav-toggle{order:3;display:inline-flex;background:none;border:1px solid var(--line);border-radius:8px;width:38px;height:38px;align-items:center;justify-content:center;cursor:pointer;font-size:1.1rem}
  .grid.cols-3,.grid.cols-2{grid-template-columns:1fr}
  .dispatch a{grid-template-columns:1fr;gap:.3rem}
  .dispatch .d-src{display:none}
}
.hero .wrap, .sec.report .wrap { display:grid; gap:1.8rem; }
.hub-aside { margin:0; align-self:center; }
.hub-aside img { display:block; width:100%; height:auto; border-radius:14px; }
.hub-aside.ph { aspect-ratio:4/3; border-radius:14px; background:linear-gradient(135deg, var(--sea) 0%, var(--accent) 100%); opacity:.30; }
@media (min-width:820px){
  .hero .wrap, .sec.report .wrap { grid-template-columns: minmax(0,2fr) minmax(0,1fr); align-items:center; }
  .hub-aside { order:2; }
  .hub-aside img, .hub-aside.ph { width:100%; max-width:340px; height:auto; aspect-ratio:3/4; object-fit:cover; object-position:center; margin-inline:auto; }
}
</style>
</head>
<body>

<header class="site-head">
  <div class="wrap">
    <a class="brand" href="#top" id="brand"></a>
    <button class="nav-toggle" aria-label="Menu" aria-expanded="false" id="navToggle">☰</button>
    <nav class="nav" id="nav"></nav>
    <a class="nav-cta" href="#report">The weekly</a>
  </div>
</header>

<div class="ribbon" aria-hidden="true"><div class="wrap"><div class="ribbon-track" id="ribbon"></div></div></div>

<main id="top">

  <section class="hero">
    <div class="wrap">
      <figure class="hub-aside" id="heroAside" hidden></figure>
      <div class="hub-main">
      <span class="eyebrow" id="heroEyebrow"></span>
      <h1 id="heroHeadline"></h1>
      <p id="heroSub"></p>
      <div class="hero-actions">
        <a class="btn" id="heroCta"></a>
        <a class="btn btn-ghost" id="heroCta2"></a>
      </div>
      </div>
    </div>
  </section>

  <section class="sec" id="trips">
    <div class="wrap">
      <div class="sec-head">
        <span class="eyebrow" id="tripsLabel"></span>
        <h2 id="tripsTitle"></h2>
        <p class="sec-note" id="tripsNote"></p>
      </div>
      <div id="tripsBody"></div>
    </div>
  </section>

  <section class="sec report" id="report">
    <div class="wrap">
      <figure class="hub-aside" id="reportAside" hidden></figure>
      <div class="hub-main">
      <span class="eyebrow" id="reportLabel"></span>
      <h2 id="reportTitle"></h2>
      <p id="reportBlurb"></p>
      <form class="signup" id="signupForm" novalidate>
        <input type="email" name="email" placeholder="you@email.com" autocomplete="email" required aria-label="Email address">
        <button class="btn" type="submit" id="signupBtn">Subscribe</button>
        <div class="cf-turnstile" data-sitekey="0x4AAAAAADUjP18lSj4N0zt1" data-callback="hubTsOk" data-theme="dark"></div>
      </form>
      <p class="signup-note" id="reportNote"></p>
      <p class="report-link" id="reportLink" hidden></p>
      <p class="form-msg" id="formMsg" role="status"></p>
      </div>
    </div>
  </section>

  <section class="sec" id="journal">
    <div class="wrap">
      <div class="sec-head">
        <span class="eyebrow" id="journalLabel"></span>
        <h2 id="journalTitle"></h2>
        <p class="sec-note" id="journalNote"></p>
      </div>
      <div id="journalBody"></div>
    </div>
  </section>

  <section class="sec elsewhere" id="elsewhere">
    <div class="wrap">
      <span class="eyebrow" id="elsewhereLabel"></span>
      <div class="social-row" id="socialRow"></div>
    </div>
  </section>

</main>

<footer class="site-foot">
  <div class="wrap">
    <div>
      <div class="f-brand" id="footBrand"></div>
      <small id="footTagline"></small>
    </div>
    <div class="f-legal" id="footLegal"></div>
  </div>
</footer>

<script>
/* ============================================================
   CONTENT — EDIT PER HUB
   One object holds every string and list on the page. Fill the
   `items` arrays as content is produced; an empty array renders
   a designed "coming soon" state and the section still shows.

   To spin up a new hub:
   1. Copy this file to  web/hub/{slug}/index.html
   2. Edit the DESIGN TOKENS block (colour / type / logo) + the
      Google Fonts <link> to match.
   3. Fill this HUB object. Seed hero/keywords/products from a
      campaign Research record or a Product; leave the rest empty.
   4. Set `slug` and `campaignTag`.
   5. Push. Set the Campaign's "live site" property to
      https://cabuzzard.github.io/dash/web/hub/{slug}/
   ============================================================ */
const HUB = {
  slug: "creative-flow-guitar",
  campaignTag: "hub-creative-flow-guitar",
  campaignId: "34b1f7d3a4bb8154b0c5e0abcaae272a",              // campaign whose Logins feed the social links

  brand: "Creative Flow Guitar",
  logoImg: "./logo.png",                       // drop a logo file in this folder, then set the filename + --logo-img

  nav: [
    { label: "Sessions",   href: "#trips" },
    { label: "The weekly", href: "#report" },
    { label: "From the room", href: "#journal" },
  ],

  // Signature strip: this week's session on the stand — key, tempo, tuning, length.
  ribbon: [
    "This week — Session 01", "Key of D", "92 BPM", "Tuning — DADGAD",
    "6:41", "One take, live", "MP3 + live recording",
  ],

  hero: {
    eyebrow: "A new guitar session every week",
    headline: "Real playing. Real feel.",
    sub: "One session a week, recorded raw — the tone, the room, the take left as it happened. No tutorials, no over-production. Download the MP3 and the live recording, study it, or just put it on.",
    ctaPrimary:   { label: "Get this week's session", href: "#trips" },
    ctaSecondary: { label: "Join the weekly",         href: "#report" },
  },

  trips: {
    label: "Sessions & downloads",
    title: "Ways in",
    note: "The weekly session, the back catalog, and the stuff around it.",
    items: [],
    empty: {
      heading: "Sessions are being set up.",
      body: "The weekly MP3 and live recording, the archive, backing tracks, the Creative Flow Principles guide, and the music-history book.",
    },
  },

  report: {
    label: "The weekly",
    title: "One email a week: the new session, and where to hear it live.",
    blurb: "Join the list and you get each week's session first — a clip, the download links, the tuning and gear notes — plus the open-mic dates around the East Bay so you can catch one in person. Free. That's the whole list.",
    note: "One email a week. Unsubscribe in one click.",
    buttonLabel: "Send me the weekly",
    link: { label: "See where I'm playing next", url: "#" },
  },

  journal: {
    label: "From the room",
    title: "Notes on each session",
    note: "The tune, the tuning, the guitar, the amp, and what I was going for.",
    items: [],
    empty: {
      heading: "First notes are coming with the first session.",
      body: "Each one covers what the piece is, the tuning and signal chain, the room, and the takes that didn't make it.",
    },
  },

  news: {
    label: "Playing live",
    title: "Open mics around the East Bay",
    note: "The Concord-area rotation — come hear a session performed live.",
    items: [],
    empty: {
      heading: "The rotation is being set.",
      body: "A regular loop of open mics around Concord, Pleasant Hill and the East Bay. Dates go out in the weekly first.",
    },
  },

  social: {
    label: "Follow",
    items: [
      { label: "Instagram", url: "https://www.instagram.com/buzzardguitar/" },
      { label: "YouTube",   url: "#" },
    ],
  },

  footer: {
    tagline: "Independent guitar sessions, recorded weekly. Every download is yours to keep — study it, sample it, play along.",
    legal: "© 2026 Creative Flow Guitar",
  },
};

/* ============================================================
   RENDER — shared, do not edit per hub
   ============================================================ */
const $ = (id) => document.getElementById(id);
const esc = (s) => String(s ?? "").replace(/[&<>"]/g, (c) => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

function renderChrome() {
  document.title = HUB.brand + " — " + HUB.hero.headline.replace(/\.$/, "");
  const brand = $("brand");
  brand.innerHTML = HUB.logoImg
    ? `<img class="brand-mark" src="${esc(HUB.logoImg)}" alt="${esc(HUB.brand)}">`
    : esc(HUB.brand);
  $("nav").innerHTML = HUB.nav.map((n) => `<a href="${esc(n.href)}">${esc(n.label)}</a>`).join("");
  $("ribbon").innerHTML = HUB.ribbon.map((r) => `<span>${esc(r)}</span>`).join("");
  $("footBrand").textContent = HUB.brand;
  $("footTagline").textContent = HUB.footer.tagline;
  $("footLegal").textContent = HUB.footer.legal;
}

function renderHero() {
  $("heroEyebrow").textContent = HUB.hero.eyebrow;
  $("heroHeadline").textContent = HUB.hero.headline;
  $("heroSub").textContent = HUB.hero.sub;
  const p = HUB.hero.ctaPrimary, s = HUB.hero.ctaSecondary, c1 = $("heroCta"), c2 = $("heroCta2");
  c1.textContent = p.label; c1.href = p.href;
  if (s && s.label) { c2.textContent = s.label; c2.href = s.href; c2.hidden = false; }
  else { c2.hidden = true; }
  paintAside("heroAside", HUB.hero.image);
}
function paintAside(id, url) {
  const el = document.getElementById(id); if (!el) return;
  if (url) { el.innerHTML = `<img src="${esc(url)}" alt="" loading="lazy">`; el.className = "hub-aside"; }
  else { el.innerHTML = ""; el.className = "hub-aside ph"; }
  el.hidden = false;
}

function emptyState(e) {
  return `<div class="empty"><strong>${esc(e.heading)}</strong>${esc(e.body)}</div>`;
}

function renderCards(sec, bodyId, labelId, titleId, noteId) {
  $(labelId).textContent = sec.label;
  $(titleId).textContent = sec.title;
  $(noteId).textContent = sec.note || "";
  const body = $(bodyId);
  if (!sec.items || !sec.items.length) { body.innerHTML = emptyState(sec.empty); return; }
  body.innerHTML = `<div class="grid cols-3">` + sec.items.map((it) => {
    const tag = it.url && it.url !== "#" ? "a" : "div";
    const href = tag === "a" ? ` href="${esc(it.url)}"` : "";
    return `<${tag} class="card"${href}>
      ${it.kicker ? `<span class="kicker">${esc(it.kicker)}</span>` : ""}
      <h3>${esc(it.title)}</h3>
      ${it.excerpt ? `<p>${esc(it.excerpt)}</p>` : ""}
      ${tag === "a" ? `<span class="more">Read →</span>` : `<span class="more">Coming soon</span>`}
    </${tag}>`;
  }).join("") + `</div>`;
}

async function renderHubJournal() {
  // Blog section: static HUB.journal.items as the instant fallback, then live —
  // the campaign's published blog posts (getHubBlog → the hub's own
  // web/hub/<slug>/blog/ dir), each a { kicker, title, excerpt, url } card
  // linking to its sub-page. Replaces the old unfiltered News Feed section
  // (removed). Mirrors renderHubProducts / getHubProducts.
  const s = HUB.journal;
  $("journalLabel").textContent = s.label;
  $("journalTitle").textContent = s.title;
  $("journalNote").textContent = s.note || "";
  const body = $("journalBody");
  const paint = (items, isLive) => {
    if (!items || !items.length) { body.innerHTML = emptyState(s.empty); return; }
    body.innerHTML = `<div class="grid cols-3">` + items.map((it) => {
      const tag = it.url && it.url !== "#" ? "a" : "div";
      const href = tag === "a" ? ` href="${esc(it.url)}"` : "";
      return `<${tag} class="card"${href}>
        ${it.kicker ? `<span class="kicker">${esc(it.kicker)}</span>` : ""}
        <h3>${esc(it.title)}</h3>
        ${it.excerpt ? `<p>${esc(it.excerpt)}</p>` : ""}
        ${tag === "a" ? `<span class="more">Read →</span>` : `<span class="more">Coming soon</span>`}
      </${tag}>`;
    }).join("") + `</div>` + (isLive ? `<p class="sec-note" style="margin-top:22px"><a href="./blog/">All posts →</a></p>` : "");
  };
  paint(s.items, false);                              // static fallback, instant
  if (!HUB.campaignId) return;
  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "getHubBlog", campaignId: HUB.campaignId, slug: HUB.slug }),
    });
    const data = await res.json();
    if (res.ok && Array.isArray(data.posts) && data.posts.length) paint(data.posts, !!data.hasIndex);
  } catch (e) { /* keep the static fallback */ }
}

function renderReport() {
  $("reportLabel").textContent = HUB.report.label;
  $("reportTitle").textContent = HUB.report.title;
  $("reportBlurb").textContent = HUB.report.blurb;
  $("reportNote").textContent = HUB.report.note;
  $("signupBtn").textContent = HUB.report.buttonLabel || "Subscribe";
  const rl = $("reportLink"), lk = HUB.report.link;
  if (lk && lk.label) { rl.innerHTML = `<a href="${esc(lk.url)}">${esc(lk.label)} →</a>`; rl.hidden = false; }
  else { rl.hidden = true; }
  paintAside("reportAside", HUB.report.image);
}

async function renderSocial() {
  $("elsewhereLabel").textContent = HUB.social.label;
  const paint = (items) => {
    $("socialRow").innerHTML = (items || [])
      .map((s) => `<a href="${esc(s.url)}"${s.url === "#" ? "" : ' target="_blank" rel="noopener"'}>${esc(s.label)}</a>`)
      .join("");
  };
  paint(HUB.social.items);            // instant, static fallback
  if (!HUB.campaignId) return;
  try {
    // Live social links: the campaign's Logins (Profile Link field) become the
    // links here. Add/point a Login in Notion and it shows up on the hub.
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "getHubSocials", campaignId: HUB.campaignId }),
    });
    const data = await res.json();
    if (res.ok && Array.isArray(data.socials) && data.socials.length) paint(data.socials);
  } catch (e) { /* keep the HUB.social.items fallback */ }
}

/* ---- newsletter form ---- */
const WORKER_URL = "https://jolly-darkness-5dcc.trailnotes2026.workers.dev";
let hubTsToken = "";
window.hubTsOk = (t) => { hubTsToken = t; };

$("signupForm").addEventListener("submit", async (e) => {
  e.preventDefault();
  const msg = $("formMsg");
  const btn = $("signupBtn");
  const email = e.target.email.value.trim();
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) {
    msg.textContent = "That email doesn't look right — check it and try again.";
    msg.className = "form-msg err";
    return;
  }
  if (!hubTsToken) {
    msg.textContent = "Finish the checkbox above, then subscribe.";
    msg.className = "form-msg err";
    return;
  }
  btn.disabled = true; btn.textContent = "Sending…";
  msg.textContent = ""; msg.className = "form-msg";
  try {
    // v1: rides the existing public submitLead path (Turnstile-gated, CORS-allowed).
    // TODO: swap to a dedicated subscribeHub worker action + subscriber list.
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        action: "submitLead",
        campaign: HUB.campaignTag,
        email,
        fraudType: "Other",
        note: "Newsletter signup — " + HUB.brand + " hub",
        tsToken: hubTsToken,
      }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Something went wrong.");
    e.target.reset();
    msg.textContent = "You're on the list.";
    msg.className = "form-msg ok";
  } catch (err) {
    msg.textContent = err.message + " Try again in a minute.";
    msg.className = "form-msg err";
  } finally {
    btn.disabled = false; btn.textContent = HUB.report.buttonLabel || "Subscribe";
    hubTsToken = "";
    if (window.turnstile) window.turnstile.reset();
  }
});

/* ---- nav toggle ---- */
$("navToggle").addEventListener("click", (e) => {
  const nav = $("nav");
  const open = nav.classList.toggle("open");
  e.currentTarget.setAttribute("aria-expanded", String(open));
});

/* ---- scroll reveal ---- */
function reveal() {
  const io = new IntersectionObserver((entries) => {
    entries.forEach((en) => { if (en.isIntersecting) { en.target.classList.add("in"); io.unobserve(en.target); } });
  }, { rootMargin: "0px 0px -8% 0px" });
  document.querySelectorAll(".card, .empty, .dispatch, .hero p, .hero-actions").forEach((el) => {
    el.classList.add("reveal"); io.observe(el);
  });
}

async function renderHubProducts() {
  // Products / Offers section: static HUB.trips.items as the instant fallback,
  // then live — the campaign's published Offers (getHubProducts → the hub's own
  // web/hub/<slug>/offers/ dir), each a card linking to its offer page (pitch +
  // lead form). Mirrors renderHubJournal / getHubBlog.
  const s = HUB.trips;
  $("tripsLabel").textContent = s.label;
  $("tripsTitle").textContent = s.title;
  $("tripsNote").textContent = s.note || "";
  const body = $("tripsBody");
  const paint = (items, isLive) => {
    if (!items || !items.length) { body.innerHTML = emptyState(s.empty); return; }
    body.innerHTML = `<div class="grid cols-3">` + items.map((it) => {
      const tag = it.url && it.url !== "#" ? "a" : "div";
      const href = tag === "a" ? ` href="${esc(it.url)}"` : "";
      return `<${tag} class="card"${href}>
        ${it.kicker ? `<span class="kicker">${esc(it.kicker)}</span>` : ""}
        <h3>${esc(it.title)}</h3>
        ${it.excerpt ? `<p>${esc(it.excerpt)}</p>` : ""}
        ${tag === "a" ? `<span class="more">Read →</span>` : `<span class="more">Coming soon</span>`}
      </${tag}>`;
    }).join("") + `</div>` + (isLive ? `<p class="sec-note" style="margin-top:22px"><a href="./offers/">All offers →</a></p>` : "");
  };
  paint(s.items, false);                              // static fallback, instant
  if (!HUB.campaignId) return;
  try {
    const res = await fetch(WORKER_URL, {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "getHubProducts", campaignId: HUB.campaignId, slug: HUB.slug }),
    });
    const data = await res.json();
    if (res.ok && Array.isArray(data.products) && data.products.length) paint(data.products, !!data.hasIndex);
  } catch (e) { /* keep the static fallback */ }
}

(async () => {
  // Fixed-copy + image overrides — web/hub/<slug>/content.json, edited from
  // the dashboard's Content Hubs tab. Deep-merged over the baked-in HUB
  // defaults BEFORE first paint. Best-effort, 2.5s cap so a slow/down worker
  // never blocks the page.
  try {
    const cr = await Promise.race([
      fetch(WORKER_URL, { method: "POST", headers: { "Content-Type": "application/json" }, body: JSON.stringify({ action: "getHubContent", slug: HUB.slug }) }),
      new Promise((_, rej) => setTimeout(() => rej(new Error("timeout")), 2500)),
    ]);
    const cd = await cr.json();
    if (cr.ok && cd && cd.overrides && typeof cd.overrides === "object") {
      const merge = (t, s) => { for (const k in s) { const v = s[k]; if (v && typeof v === "object" && !Array.isArray(v)) { t[k] = (t[k] && typeof t[k] === "object") ? t[k] : {}; merge(t[k], v); } else if (v !== undefined && v !== null && v !== "") t[k] = v; } };
      merge(HUB, cd.overrides);
    }
  } catch (e) { /* baked defaults stand */ }
  renderChrome();
  renderHero();
  renderHubJournal();
  renderReport();
  renderHubProducts();
  renderSocial();
  if (!window.matchMedia || !window.matchMedia("(prefers-reduced-motion: reduce)").matches) reveal();
})();
</script>
