<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Multifamily Acquisitions — Acquire Multifamily Properties That Actually Cash Flow</title>
<meta name="description" content="A disciplined acquisition framework — deal sourcing, underwriting, and off-market access — built for serious multifamily investors ready to grow a real portfoli">
<meta property="og:title" content="Multifamily Acquisitions">
<meta property="og:description" content="A disciplined acquisition framework — deal sourcing, underwriting, and off-market access — built for serious multifamily investors ready to grow a real portfoli">
<meta name="robots" content="index,follow">

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<!-- FONTS — EDIT PER PAGE (must match --font-* below) -->
<link href="https://fonts.googleapis.com/css2?family=DM+Serif+Display:ital@0;1&family=Inter:wght@400;500;600&display=swap" rel="stylesheet">

<script src="https://challenges.cloudflare.com/turnstile/v0/api.js?render=explicit" async defer></script>

<style>
/* ============================================================
   DESIGN TOKENS — EDIT PER PAGE
   ============================================================ */
:root{
  --bg:        #0D1117;
  --surface:   #161B24;
  --ink:       #E8ECF0;
  --ink-soft:  #8A95A3;
  --line:      #232B36;
  --accent:    #2F7FFF;   /* used once — the button */
  --accent-ink:#ffffff;
  --deep:      #1A3A6B;
  --deep-ink:  #E8ECF0;

  --font-display: "DM Serif Display", Georgia, serif;
  --font-body:    "Inter", system-ui, sans-serif;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg:#111418; --surface:#181c22; --ink:#eef1f4; --ink-soft:#a3adb9; --line:#2a2f37;
    --deep:#0c1826; --deep-ink:#cdd8e6;
  }
}

/* ============================================================
   SHARED LAYOUT — do not edit per page
   ============================================================ */
*,*::before,*::after{box-sizing:border-box;margin:0;padding:0}
html{-webkit-text-size-adjust:100%}
body{background:var(--bg);color:var(--ink);font-family:var(--font-body);font-size:1.0625rem;line-height:1.6;-webkit-font-smoothing:antialiased}
img{max-width:100%;display:block}
a{color:var(--accent)}
:focus-visible{outline:2px solid var(--accent);outline-offset:3px;border-radius:3px}

.wrap{width:min(680px,100% - 2.5rem);margin-inline:auto}
.wide{width:min(1000px,100% - 2.5rem);margin-inline:auto}

.hero{padding:clamp(48px,9vw,104px) 0 clamp(36px,6vw,64px);text-align:center}
.eyebrow{font-family:var(--font-display);font-size:.75rem;font-weight:600;letter-spacing:.12em;text-transform:uppercase;color:var(--accent);margin-bottom:14px}
h1{font-family:var(--font-display);font-weight:700;font-size:clamp(1.9rem,1.2rem + 3.4vw,3rem);line-height:1.1;letter-spacing:-.015em;text-wrap:balance;margin-bottom:18px}
.sub{font-size:clamp(1.05rem,1rem + .5vw,1.3rem);color:var(--ink-soft);max-width:44ch;margin:0 auto 34px;text-wrap:balance}

.form-card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:clamp(20px,4vw,32px);max-width:460px;margin:0 auto;text-align:left;box-shadow:0 1px 2px rgba(15,20,30,.04),0 12px 32px rgba(15,20,30,.06)}
.form-card h2{font-family:var(--font-display);font-size:1.05rem;font-weight:600;margin-bottom:4px}
.form-card p.note{font-size:.85rem;color:var(--ink-soft);margin-bottom:14px}
.lp-form{display:flex;flex-direction:column;gap:10px}
.lp-form input[type=email]{width:100%;padding:13px 14px;font:inherit;border:1px solid var(--line);border-radius:9px;background:var(--bg);color:var(--ink)}
.lp-form button{width:100%;padding:13px 16px;font:inherit;font-weight:600;border:0;border-radius:9px;background:var(--accent);color:var(--accent-ink);cursor:pointer;transition:filter .12s}
.lp-form button:hover{filter:brightness(1.06)}
.lp-form button:disabled{opacity:.6;cursor:default}
.form-fine{font-size:.78rem;color:var(--ink-soft);margin-top:10px;text-align:center}
.form-msg{font-size:.9rem;margin-top:10px;min-height:1.2em;text-align:center}
.form-msg.ok{color:#1f9d55}
.form-msg.err{color:#d64545}
#tsWrap{display:flex;justify-content:center;margin-top:2px}

.trust{padding:22px 0 4px;text-align:center}
.trust ul{list-style:none;display:flex;flex-wrap:wrap;gap:10px 22px;justify-content:center;font-size:.85rem;color:var(--ink-soft)}
.trust li{position:relative;padding-left:16px}
.trust li::before{content:"✓";position:absolute;left:0;color:var(--accent);font-weight:700}

.posts{padding:clamp(40px,7vw,72px) 0}
.posts h2{font-family:var(--font-display);font-size:1.35rem;font-weight:600;text-align:center;margin-bottom:6px}
.posts .lead{text-align:center;color:var(--ink-soft);font-size:.95rem;margin-bottom:26px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(240px,1fr));gap:14px}
.card{display:block;text-decoration:none;color:inherit;background:var(--surface);border:1px solid var(--line);border-radius:11px;padding:16px 16px 18px;transition:border-color .12s,transform .12s}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card .kicker{font-size:.68rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--ink-soft)}
.card h3{font-family:var(--font-display);font-size:1rem;font-weight:600;line-height:1.3;margin:5px 0 6px}
.card p{font-size:.88rem;color:var(--ink-soft)}
.posts .empty{text-align:center;color:var(--ink-soft);font-size:.92rem;border:1px dashed var(--line);border-radius:11px;padding:28px}
.allposts{text-align:center;margin-top:22px;font-size:.9rem}

.recap{background:var(--deep);color:var(--deep-ink);padding:clamp(38px,6vw,60px) 0;text-align:center}
.recap p{font-size:1.1rem;max-width:40ch;margin:0 auto 18px}
.recap a.btn{display:inline-block;padding:13px 22px;border-radius:9px;background:var(--accent);color:var(--accent-ink);text-decoration:none;font-weight:600}

footer{padding:34px 0 48px;text-align:center;color:var(--ink-soft);font-size:.82rem;border-top:1px solid var(--line)}
footer strong{color:var(--ink);font-family:var(--font-display)}

@media (prefers-reduced-motion:reduce){*{transition:none!important}}
</style>
</head>
<body>

<section class="hero">
  <div class="wrap">
    <div class="eyebrow" id="lpEyebrow"></div>
    <h1 id="lpH1"></h1>
    <p class="sub" id="lpSub"></p>

    <div class="form-card">
      <h2 id="lpFormHeadline"></h2>
      <p class="note" id="lpFormNote"></p>
      <form class="lp-form" id="lpForm" novalidate>
        <input type="email" name="email" id="lpEmail" placeholder="you@email.com" autocomplete="email" required aria-label="Email address">
        <div id="tsWrap"></div>
        <button type="submit" id="lpBtn">Subscribe</button>
      </form>
      <div class="form-fine" id="lpFine"></div>
      <div class="form-msg" id="lpMsg"></div>
    </div>
  </div>

  <div class="trust wrap" id="lpTrustWrap" hidden>
    <ul id="lpTrust"></ul>
  </div>
</section>

<section class="posts" id="lpPostsSection">
  <div class="wide">
    <h2 id="lpPostsTitle">Read first</h2>
    <p class="lead" id="lpPostsLead"></p>
    <div id="lpPosts"><div class="empty">Guides are on the way.</div></div>
    <div class="allposts" id="lpAllPosts" hidden><a href="./blog/">All articles →</a></div>
  </div>
</section>

<section class="recap">
  <div class="wrap">
    <p id="lpRecap"></p>
    <a class="btn" href="#lpForm" id="lpRecapBtn">Get started</a>
  </div>
</section>

<footer>
  <div class="wrap">
    <strong id="lpFootBrand"></strong>
    <div id="lpFootTagline" style="margin-top:6px;"></div>
    <div style="margin-top:10px;"><a href="#" id="lpFootContact" hidden></a></div>
  </div>
</footer>

<script>
/* ============================================================
   CONTENT — EDIT PER PAGE
   One product, one keyword. Slice of a hub, standalone.
   ============================================================ */
const LP = {
  slug: "insider-access-built-in",
  campaignTag: "lp-insider-access-built-in",
  campaignId: "3d71f7d3a4bb81e0971befc5be8ee9ee",
  contactEmail: null,

  brand: "Multifamily Acquisitions",
  eyebrow: "Apartment Complex Acquisition",
  h1: "Acquire Multifamily Properties That Actually Cash Flow.",
  sub: "A disciplined acquisition framework — deal sourcing, underwriting, and off-market access — built for serious multifamily investors ready to grow a real portfolio.",

  form: {
    headline: "Get Your Acquisition Playbook",
    note: "Deal criteria templates, underwriting checklists, and off-market sourcing tactics — sent directly to your inbox.",
    button: "Send Me the Acquisition Playbook",
    fine: "No spam. One-click unsubscribe.",
    success: "You're in — check your inbox for the playbook in the next few minutes.",
  },

  trust: [ "Off-market deal sourcing strategies used on 50+ apartment community acquisitions.", "Underwriting frameworks stress-tested across value-add and institutional multifamily assets.", "Syndication-ready acquisition structures for GP teams and portfolio operators.", "Built from real transactions — not theory, not courses." ],

  posts: { title: "Read before you make an offer", lead: "The most common underwriting mistakes that kill multifamily deals at due diligence — and how to avoid them." },

  recap: "If you're serious about multifamily acquisitions — whether you're chasing your first 20-unit or scaling a syndication portfolio — the playbook covers exactly how to source, underwrite, and close deals that others miss. Drop your email and get it now.",
  recapButton: "Get the Acquisition Playbook",

  footerTagline: "Multifamily acquisition strategy — deal sourcing, underwriting, and off-market access for apartment investors.",
};

/* ============================================================
   RENDER — shared, do not edit per page
   ============================================================ */
const WORKER_URL = "https://jolly-darkness-5dcc.trailnotes2026.workers.dev";
const TURNSTILE_SITE_KEY = "0x4AAAAAADUjP18lSj4N0zt1";
const $ = id => document.getElementById(id);
const esc = s => String(s ?? "").replace(/[&<>"]/g, c => ({ "&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;" }[c]));

function render() {
  document.title = LP.brand + " — " + LP.h1.replace(/\.$/, "");
  if (LP.eyebrow) $("lpEyebrow").textContent = LP.eyebrow; else $("lpEyebrow").hidden = true;
  $("lpH1").textContent = LP.h1;
  $("lpSub").textContent = LP.sub;
  $("lpFormHeadline").textContent = LP.form.headline;
  $("lpFormNote").textContent = LP.form.note;
  $("lpBtn").textContent = LP.form.button;
  $("lpFine").textContent = LP.form.fine;
  $("lpPostsTitle").textContent = LP.posts.title;
  if (LP.posts.lead) $("lpPostsLead").textContent = LP.posts.lead; else $("lpPostsLead").hidden = true;
  $("lpRecap").textContent = LP.recap;
  $("lpRecapBtn").textContent = LP.recapButton;
  $("lpFootBrand").textContent = LP.brand;
  $("lpFootTagline").textContent = LP.footerTagline;
  if (LP.contactEmail) { const c = $("lpFootContact"); c.hidden = false; c.textContent = LP.contactEmail; c.href = "mailto:" + LP.contactEmail; }
  if (Array.isArray(LP.trust) && LP.trust.length) {
    $("lpTrustWrap").hidden = false;
    $("lpTrust").innerHTML = LP.trust.map(t => `<li>${esc(t)}</li>`).join("");
  }
}

async function loadPosts() {
  try {
    const r = await fetch("./blog/posts.json", { cache: "no-store" });
    if (!r.ok) return;
    const raw = await r.json();
    const posts = Array.isArray(raw) ? raw : (raw.posts || []);
    if (!posts.length) return;
    $("lpPosts").innerHTML = `<div class="grid">` + posts.slice(0, 6).map(p => `
      <a class="card" href="${esc(p.url || ("./blog/" + (p.slug || "") + "/"))}">
        ${p.kicker ? `<span class="kicker">${esc(p.kicker)}</span>` : ""}
        <h3>${esc(p.title)}</h3>
        ${p.excerpt ? `<p>${esc(p.excerpt)}</p>` : ""}
      </a>`).join("") + `</div>`;
    if (posts.length > 6) $("lpAllPosts").hidden = false;
  } catch (e) { /* leave the empty state */ }
}

let lpTsToken = "";
function mountTurnstile() {
  if (!window.turnstile) { setTimeout(mountTurnstile, 300); return; }
  window.turnstile.render("#tsWrap", {
    sitekey: TURNSTILE_SITE_KEY,
    callback: t => { lpTsToken = t; },
    "expired-callback": () => { lpTsToken = ""; },
    theme: "auto",
  });
}

$("lpForm").addEventListener("submit", async e => {
  e.preventDefault();
  const btn = $("lpBtn"), msg = $("lpMsg");
  const email = ($("lpEmail").value || "").trim();
  msg.textContent = ""; msg.className = "form-msg";
  if (!/^[^\s@]+@[^\s@]+\.[^\s@]+$/.test(email)) { msg.textContent = "Check that email address."; msg.className = "form-msg err"; return; }
  if (!lpTsToken) { msg.textContent = "Finish the checkbox above, then submit."; msg.className = "form-msg err"; return; }
  btn.disabled = true; btn.textContent = "Sending…";
  try {
    const res = await fetch(WORKER_URL, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ action: "submitLead", campaign: LP.campaignTag, email, fraudType: "Other", note: "Landing page signup — " + LP.brand, tsToken: lpTsToken }),
    });
    const data = await res.json();
    if (!res.ok) throw new Error(data.error || "Something went wrong.");
    e.target.reset();
    msg.textContent = LP.form.success; msg.className = "form-msg ok";
  } catch (err) {
    msg.textContent = err.message + " Try again in a minute."; msg.className = "form-msg err";
  } finally {
    btn.disabled = false; btn.textContent = LP.form.button;
    lpTsToken = ""; if (window.turnstile) window.turnstile.reset();
  }
});

render();
loadPosts();
mountTurnstile();
</script>
</body>
</html>
