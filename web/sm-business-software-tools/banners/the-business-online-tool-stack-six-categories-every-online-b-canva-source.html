<!doctype html><html><head><meta charset="utf-8">
<link href="https://fonts.googleapis.com/css2?family=Poppins:wght@700&family=Lora:ital,wght@0,400;1,400&display=swap" rel="stylesheet">
<style>
  * { margin:0; padding:0; box-sizing:border-box; }
  .banner { width:1280px; height:720px; background:#ffffff; position:relative; overflow:hidden; font-family:'Lora',serif; }
  .dots { position:absolute; width:90px; height:100px; background-image:radial-gradient(#7ed32155 1.5px, transparent 1.5px); background-size:10px 10px; opacity:.6; }
  .dots.tr { top:0; right:0; } .dots.bl { bottom:0; left:0; }
  .divider { position:absolute; top:-5%; left:780px; width:2px; height:110%; background:#222222; opacity:.35; transform:skewX(-8deg); }
  .col { position:absolute; left:80px; top:170px; width:620px; }
  h1 { font-family:'Poppins',sans-serif; font-weight:700; font-size:46px; line-height:0.98; letter-spacing:-0.01em; color:#222222; white-space:pre-line; }
  .accent { font-family:'Poppins',sans-serif; font-weight:700; font-size:46px; line-height:0.98; letter-spacing:-0.01em; color:#7ed321; margin-top:18px; }
  p { font-size:17px; line-height:1.4; color:#222222; opacity:.85; margin-top:28px; max-width:480px; }

body { width:auto; height:auto; overflow:visible; }
</style></head><body>
  <div data-document-role="page" data-label="Banner" class="banner">
  <div class="dots tr"></div>
  <div class="dots bl"></div>
  <div class="divider"></div>
  <div class="col">
    <h1>The Business\nOnline Tool Stack</h1>
    <div class="accent">Six categories. One sequence.</div>
    <p>Stop collecting tools at random — here's the deliberate stack that moves strangers to repeat customers.</p>
  </div>
  </div>
</body></html>
