<!doctype html>
<html
  lang="en"
  data-composition-variables='[
    {"id":"hook","type":"string","label":"Hook (first line, ≤60 chars)","default":"Your numbers live in five different tools.","maxLength":90},
    {"id":"beat1","type":"string","label":"Beat 1 (≤70 chars)","default":"Your ad platform says one thing.","maxLength":90},
    {"id":"beat2","type":"string","label":"Beat 2 (≤70 chars)","default":"Your CRM says another.","maxLength":90},
    {"id":"beat3","type":"string","label":"Beat 3 (≤70 chars)","default":"One dashboard ends the guessing.","maxLength":90},
    {"id":"cta","type":"string","label":"CTA (≤40 chars)","default":"See how it works","maxLength":50},
    {"id":"brand","type":"string","label":"Brand / handle","default":"AI System Implementation","maxLength":40},
    {"id":"bgImage","type":"string","label":"Background plate URL","default":"assets/plate-default.jpg"},
    {"id":"bg","type":"color","label":"Background","default":"#ffffff"},
    {"id":"ink","type":"color","label":"Ink","default":"#1a2a1a"},
    {"id":"accent","type":"color","label":"Accent","default":"#1b881b"},
    {"id":"displayFont","type":"enum","label":"Display font","default":"Bricolage Grotesque","options":[
      {"value":"Bricolage Grotesque","label":"Bricolage Grotesque"},{"value":"Newsreader","label":"Newsreader"},{"value":"DM Serif Display","label":"DM Serif Display"},
      {"value":"Familjen Grotesk","label":"Familjen Grotesk"},{"value":"Bitter","label":"Bitter"},{"value":"Space Grotesk","label":"Space Grotesk"},
      {"value":"Archivo","label":"Archivo"},{"value":"Fraunces","label":"Fraunces"},{"value":"Libre Franklin","label":"Libre Franklin"},
      {"value":"Inter","label":"Inter"},{"value":"Hanken Grotesk","label":"Hanken Grotesk"},{"value":"IBM Plex Sans","label":"IBM Plex Sans"}]},
    {"id":"bodyFont","type":"enum","label":"Body font","default":"Hanken Grotesk","options":[
      {"value":"Hanken Grotesk","label":"Hanken Grotesk"},{"value":"Inter","label":"Inter"},{"value":"IBM Plex Sans","label":"IBM Plex Sans"},
      {"value":"Libre Franklin","label":"Libre Franklin"},{"value":"Space Grotesk","label":"Space Grotesk"},{"value":"Archivo","label":"Archivo"}]}
  ]'
>
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=1080, height=1920" />
    <title>Reel — kinetic text (dash template)</title>
    <link rel="stylesheet" href="fonts.css" />
    <script src="https://cdn.jsdelivr.net/npm/gsap@3.14.2/dist/gsap.min.js"></script>
    <style>
      body { margin: 0; background: #000; }
      #reel { position: relative; width: 1080px; height: 1920px; overflow: hidden; }

      /* full-bleed layers live on children, never on the root (producer can drop root bg) */
      #bgfill { position: absolute; inset: 0; background: var(--bg); }
      #plate-wrap { position: absolute; inset: 0; overflow: hidden; }
      #plate { display: block; width: 100%; height: 100%; object-fit: cover; }
      #scrim {
        position: absolute; inset: 0;
        background: linear-gradient(180deg,
          color-mix(in srgb, var(--bg) 20%, transparent) 0%,
          color-mix(in srgb, var(--bg) 78%, transparent) 38%,
          color-mix(in srgb, var(--bg) 82%, transparent) 70%,
          color-mix(in srgb, var(--bg) 35%, transparent) 100%);
      }

      /* Reels safe band: keep copy between ~280px and ~1450px */
      .scene {
        position: absolute; left: 0; top: 0; width: 100%; height: 100%;
        box-sizing: border-box; padding: 300px 96px 470px;
        display: flex; flex-direction: column; justify-content: center; gap: 36px;
      }
      .eyebrow {
        display: block; font-family: var(--bodyFontStack); font-weight: 600; font-size: 34px;
        letter-spacing: 0.14em; text-transform: uppercase; color: var(--ink);
        align-self: flex-start; padding-bottom: 10px; border-bottom: 6px solid var(--accent);
      }
      .hook {
        margin: 0; font-family: var(--displayFontStack); font-weight: 700; color: var(--ink);
        line-height: 1.02; letter-spacing: -0.02em; max-width: 888px;
      }
      .beat-num {
        display: block; width: 150px; font-family: var(--displayFontStack); font-weight: 700;
        font-size: 150px; line-height: 0.9; color: var(--accent);
      }
      .beat-text {
        margin: 0; font-family: var(--displayFontStack); font-weight: 600; color: var(--ink);
        line-height: 1.06; letter-spacing: -0.015em; max-width: 888px;
      }
      .rule { display: block; width: 160px; height: 10px; background: var(--accent); border-radius: 5px; transform-origin: left center; }
      .w { display: inline-block; }
      .cta-pill {
        display: block; align-self: flex-start; box-sizing: border-box; max-width: 888px;
        padding: 34px 54px; border-radius: 999px; background: var(--accent); color: #fff;
        font-family: var(--bodyFontStack); font-weight: 600; font-size: 60px; line-height: 1.1;
      }
      .brand { display: block; font-family: var(--bodyFontStack); font-weight: 500; font-size: 40px; color: var(--ink); opacity: 0.85; }
    </style>
  </head>
  <body>
    <div id="reel" data-composition-id="reel" data-start="0" data-width="1080" data-height="1920" data-duration="20">
      <div id="bgfill"></div>
      <div id="plate-wrap"><img id="plate" data-layout-allow-overflow data-var-src="bgImage" src="assets/plate-default.jpg" alt="" crossorigin="anonymous" /></div>
      <div id="scrim"></div>

      <section id="s-hook" class="scene clip" data-start="0" data-duration="5" data-track-index="1">
        <span id="hook-eyebrow" class="eyebrow" data-var-text="brand">Brand</span>
        <h1 id="hook-text" class="hook">Hook</h1>
      </section>

      <section id="s-b1" class="scene clip" data-start="5" data-duration="4" data-track-index="1">
        <span id="b1-num" class="beat-num">01</span>
        <span id="b1-rule" class="rule"></span>
        <p id="b1-text" class="beat-text">Beat one</p>
      </section>

      <section id="s-b2" class="scene clip" data-start="9" data-duration="4" data-track-index="1">
        <span id="b2-num" class="beat-num">02</span>
        <span id="b2-rule" class="rule"></span>
        <p id="b2-text" class="beat-text">Beat two</p>
      </section>

      <section id="s-b3" class="scene clip" data-start="13" data-duration="4" data-track-index="1">
        <span id="b3-num" class="beat-num">03</span>
        <span id="b3-rule" class="rule"></span>
        <p id="b3-text" class="beat-text">Beat three</p>
      </section>

      <section id="s-cta" class="scene clip" data-start="17" data-duration="3" data-track-index="1">
        <span id="cta-pill" class="cta-pill" data-var-text="cta">CTA</span>
        <span id="cta-brand" class="brand" data-var-text="brand">Brand</span>
      </section>
    </div>

    <script>
      (function () {
        const V = (window.__hyperframes && window.__hyperframes.getVariables && window.__hyperframes.getVariables()) || {};
        const FALLBACK = { serif: "Georgia, serif", sans: "system-ui, sans-serif" };
        const SERIFS = ["Newsreader", "DM Serif Display", "Bitter", "Fraunces"];
        const stack = f => `"${f}", ${SERIFS.includes(f) ? FALLBACK.serif : FALLBACK.sans}`;
        const root = document.getElementById("reel");
        root.style.setProperty("--displayFontStack", stack(V.displayFont || "Bricolage Grotesque"));
        root.style.setProperty("--bodyFontStack", stack(V.bodyFont || "Hanken Grotesk"));

        // Size by copy length (deterministic — no font-dependent measurement at init).
        const sizeFor = (text, big, small) => {
          const n = String(text || "").length;
          if (n <= 24) return big;
          if (n >= 80) return small;
          return Math.round(big - (big - small) * ((n - 24) / 56));
        };
        // Word spans for the word-by-word rise.
        const words = (el, text) => {
          el.textContent = "";
          String(text || "").trim().split(/\s+/).forEach((w, i, a) => {
            const s = document.createElement("span");
            s.className = "w"; s.textContent = w + (i < a.length - 1 ? " " : "");
            el.appendChild(s);
          });
          return el.querySelectorAll(".w");
        };

        const hookEl = document.getElementById("hook-text");
        hookEl.style.fontSize = sizeFor(V.hook, 132, 84) + "px";
        const hookWords = words(hookEl, V.hook || "Your numbers live in five different tools.");
        const beats = [1, 2, 3].map(i => {
          const el = document.getElementById(`b${i}-text`);
          const t = V[`beat${i}`] || "";
          el.style.fontSize = sizeFor(t, 104, 70) + "px";
          return words(el, t);
        });

        window.__timelines = window.__timelines || {};
        const tl = gsap.timeline({ paused: true });

        // Plate: one slow push-in across the whole reel.
        tl.fromTo("#plate", { scale: 1.0 }, { scale: 1.12, duration: 20, ease: "none" }, 0);

        // HOOK 0–5
        tl.from("#hook-eyebrow", { y: 30, opacity: 0, duration: 0.5, ease: "power3.out" }, 0.25);
        tl.from(hookWords, { yPercent: 70, opacity: 0, duration: 0.6, ease: "power3.out", stagger: 0.09 }, 0.45);
        tl.to("#s-hook .hook, #hook-eyebrow", { y: -40, opacity: 0, duration: 0.4, ease: "power2.in" }, 4.55);

        // BEATS 5–17 (4s each)
        [5, 9, 13].forEach((t0, k) => {
          const i = k + 1;
          tl.from(`#b${i}-num`, { x: -80, opacity: 0, duration: 0.55, ease: "power3.out" }, t0 + 0.15);
          tl.from(`#b${i}-rule`, { scaleX: 0, duration: 0.5, ease: "power2.out" }, t0 + 0.35);
          tl.from(beats[k], { yPercent: 60, opacity: 0, duration: 0.5, ease: "power3.out", stagger: 0.07 }, t0 + 0.45);
          tl.to(`#b${i}-num, #b${i}-rule, #b${i}-text`, { x: 60, opacity: 0, duration: 0.35, ease: "power2.in" }, t0 + 3.6);
        });

        // CTA 17–20
        tl.from("#cta-pill", { scale: 0.85, opacity: 0, duration: 0.55, ease: "back.out(1.6)" }, 17.2);
        tl.from("#cta-brand", { y: 24, opacity: 0, duration: 0.45, ease: "power3.out" }, 17.55);

        window.__timelines["reel"] = tl;
      })();
    </script>
  </body>
</html>
