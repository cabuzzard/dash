name: Deploy content hubs to Cloudflare Pages

on:
  push:
    branches: [main]
    paths:
      - 'web/hub/**'
      - '.github/workflows/deploy-hub-pages.yml'
  workflow_dispatch: {}

concurrency:
  group: deploy-hub-pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: cloudflare/wrangler-action@v3
        with:
          apiToken: ${{ secrets.CLOUDFLARE_API_TOKEN }}
          accountId: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
          command: pages deploy web/hub --project-name dash-hubs --branch main --commit-dirty=true
