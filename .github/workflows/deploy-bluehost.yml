name: Deploy live sites to Bluehost

on:
  push:
    branches: [main]
    paths:
      - 'web/**'
      - '.github/bluehost-sites.tsv'
      - '.github/workflows/deploy-bluehost.yml'
  workflow_dispatch: {}

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Set up SSH
        run: |
          mkdir -p ~/.ssh
          echo "${{ secrets.BLUEHOST_SSH_KEY }}" > ~/.ssh/deploy_key
          chmod 600 ~/.ssh/deploy_key
          ssh-keyscan -H "${{ secrets.BLUEHOST_HOST }}" >> ~/.ssh/known_hosts

      - name: Deploy each mapped site
        run: |
          SSH='ssh -i ~/.ssh/deploy_key -o IdentitiesOnly=yes -o StrictHostKeyChecking=no -o BatchMode=yes'
          failed=""
          while IFS=$'\t' read -r local remote || [ -n "$local" ]; do
            local="${local%$'\r'}"; remote="${remote%$'\r'}"
            [ -z "$local" ] && continue
            case "$local" in \#*) continue ;; esac
            [ -d "$local" ] || { echo "skip: $local (no such dir)"; continue; }
            echo "Deploying $local -> $remote"
            # --rsync-path mkdir -p: the remote dir may not exist yet (a hub folder
            # before its addon domain is set up in cPanel). Create it, then sync.
            if rsync -avz --rsync-path="mkdir -p '$remote' && rsync" -e "$SSH" \
                 "$local/" "${{ secrets.BLUEHOST_USER }}@${{ secrets.BLUEHOST_HOST }}:$remote/"; then
              echo "  ok"
            else
              echo "  FAILED: $local -> $remote"
              failed="$failed $local"
            fi
          done < .github/bluehost-sites.tsv
          if [ -n "$failed" ]; then echo "Failed mappings:$failed"; exit 1; fi
